<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>salacv</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: grid; place-items: center; overflow: hidden; -webkit-app-region: drag; user-select: none;
    background: #0b0d11; color: #f3f5f8; font: 400 14px/1.4 'Segoe UI', system-ui, sans-serif;
    border: 1px solid #2a303a;
  }
  main { display: flex; flex-direction: column; align-items: center; gap: 14px; animation: in 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  .mark {
    display: grid; place-items: center; width: 64px; height: 64px; border-radius: 18px;
    background: #38bdf8; color: #061826; font: 700 30px/1 'Segoe UI', system-ui, sans-serif;
    animation: pop 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  p { color: #9aa3af; font-size: 13px; }
  .bar { width: 160px; height: 3px; margin-top: 10px; border-radius: 3px; background: #1c2027; overflow: hidden; }
  .bar span { display: block; width: 40%; height: 100%; border-radius: 3px; background: #38bdf8; animation: slide 1.2s ease-in-out infinite; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes pop { 0% { transform: scale(0.7); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }
  @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; } }
</style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">S</div>
    <h1>salacv</h1>
    <p>Ton CV, de l’école au premier emploi</p>
    <div class="bar" role="progressbar" aria-label="Chargement"><span></span></div>
  </main>
</body>
</html>
