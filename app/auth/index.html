<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>salacv — connexion</title>
  <link rel="icon" href="/brand.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#f8fafc">
  <script>
    try { var t = localStorage.getItem('salacv:theme') || 'light'; document.documentElement.dataset.theme = t === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t; var m = document.querySelector('meta[name=theme-color]'); if (m) m.content = document.documentElement.dataset.theme === 'dark' ? '#0b0d11' : '#f8fafc'; } catch {}
  </script>
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../auth.css">
</head>
<body>
  <div class="auth-layout">
    <main class="auth-side">
      <a class="auth-brand" href="/"><img class="auth-mark" src="/brand.svg" alt="" width="30" height="30"><span>salacv<span class="brand-tld">.online</span></span></a>
      <div class="auth-card" aria-live="polite">
        <h1 id="auth-title">Connexion</h1>
        <p id="auth-text" class="auth-text">Connecte-toi avec ton compte Google pour retrouver ton CV et tes crédits.</p>
        <button id="auth-google" class="auth-google" type="button" data-state="busy" disabled>
          <span class="auth-spinner" aria-hidden="true"></span>
          <svg class="auth-g" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09C3.26 21.3 7.31 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62H1.29a11.86 11.86 0 0 0 0 10.76l3.98-3.09z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.98 3.09C6.22 6.86 8.87 4.75 12 4.75z"/></svg>
          <span id="auth-label">Vérification…</span>
        </button>
        <p id="auth-status" class="auth-status" role="status" hidden></p>
        <p id="auth-error" class="auth-error" role="alert" hidden></p>
        <p class="auth-foot">salacv ne voit jamais ton mot de passe Google.</p>
      </div>
    </main>
    <aside class="auth-show" aria-hidden="true">
      <div class="auth-show-cols" id="auth-show-cols"></div>
      <p class="auth-show-cap">Douze modèles, gratuits et premium. D’autres arrivent.</p>
    </aside>
  </div>
  <script type="module" src="../auth.js"></script>
</body>
</html>
