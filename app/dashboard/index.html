<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>salacv — mes CV</title>
  <link rel="icon" href="/brand.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#f8fafc">
  <script>
    try { var t = localStorage.getItem('salacv:theme') || 'light'; document.documentElement.dataset.theme = t === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t; var m = document.querySelector('meta[name=theme-color]'); if (m) m.content = document.documentElement.dataset.theme === 'dark' ? '#0b0d11' : '#f8fafc'; } catch {}
  </script>
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../dashboard.css">
  <link rel="stylesheet" href="../dialog.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/" aria-label="salacv.online, accueil"><img class="brand-mark" src="/brand.svg" alt="" width="28" height="28">salacv<span class="brand-tld">.online</span></a>
    <nav class="tabs" aria-label="Sections">
      <a href="#projets" data-tab="projets">Mes CV</a>
      <a href="#explorer" data-tab="explorer">Explorer</a>
      <a href="#credits" data-tab="credits">Crédits</a>
    </nav>
    <a id="credit-pill" class="credit-pill" href="#credits" aria-label="Crédits restants"><span class="coin" aria-hidden="true"></span><strong id="credit-count"><span class="skel skel-num" aria-hidden="true"></span></strong></a>
    <button id="theme" class="icon-btn" type="button" aria-label="Changer de thème"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor"/></svg></button>
    <div id="account" class="account"></div>
    <span class="toolbar-progress" aria-hidden="true"></span>
  </header>

  <main id="view" class="view" tabindex="-1"></main>
  <script>
    // Dès le premier instant, la forme de la page en shimmer (jamais d'écran vide), selon l'onglet demandé.
    // dashboard.js la remplace par le vrai contenu quand il est prêt.
    (function () {
      var tab = location.hash.slice(1);
      var b = function (c) { return '<span class="skel ' + c + '"></span>'; };
      var body = tab === 'credits' || tab === 'compte'
        ? '<div class="credit-grid">' + b('skel-panel tall') + b('skel-panel') + b('skel-panel wide') + '</div>'
        : (tab === 'projets' || tab === 'personnalites' || !tab ? b('skel-tabs') + b('skel-search') : b('skel-tabs')) + '<div class="cards">' + b('skel-card') + b('skel-card') + b('skel-card') + b('skel-card') + '</div>';
      document.getElementById('view').innerHTML = '<section class="skel-view" aria-busy="true" aria-label="Chargement">' + b('skel-title') + b('skel-sub') + body + '</section>';
    })();
  </script>

  <!-- Mobile : onglets en bas, à portée du pouce. -->
  <nav class="bottom-tabs" aria-label="Sections">
    <a href="#projets" data-tab="projets"><svg class="tab-icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="fill" d="M6 3h8l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M14 3v5h5"/><path class="cut" d="M8 13h8M8 17h5"/></svg>Mes CV</a>
    <a href="#explorer" data-tab="explorer"><svg class="tab-icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect class="fill" x="3.5" y="3.5" width="7" height="7" rx="2"/><rect class="fill" x="13.5" y="3.5" width="7" height="7" rx="2"/><rect class="fill" x="3.5" y="13.5" width="7" height="7" rx="2"/><rect class="fill" x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>Explorer</a>
    <a href="/studio/?new" class="bt-new" aria-label="Nouveau CV"><span><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span></a>
    <a href="#credits" data-tab="credits"><svg class="tab-icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle class="fill" cx="12" cy="12" r="8.5"/><path class="cut" d="M14.6 9.4c-.5-.8-1.5-1.3-2.6-1.3-1.5 0-2.6.8-2.6 1.9 0 2.6 5.4 1.4 5.4 4 0 1.2-1.2 2-2.8 2-1.2 0-2.3-.5-2.8-1.4"/></svg>Crédits</a>
  </nav>

  <script type="module" src="../dashboard.js"></script>
</body>
</html>
