<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>salacv — administration</title>
  <link rel="icon" href="/brand.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#f8fafc">
  <script>
    try { var t = localStorage.getItem('salacv:theme') || 'light'; document.documentElement.dataset.theme = t === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t; var m = document.querySelector('meta[name=theme-color]'); if (m) m.content = document.documentElement.dataset.theme === 'dark' ? '#0b0d11' : '#f8fafc'; } catch {}
  </script>
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../dashboard.css">
  <link rel="stylesheet" href="../dialog.css">
  <link rel="stylesheet" href="../admin.css">
</head>
<body class="admin">
  <!-- Barre du haut : menu, marque, recherche, thème, compte. -->
  <header class="ad-top">
    <button id="menu" class="icon-btn" type="button" aria-label="Menu" title="Menu (Ctrl B)">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/></svg>
    </button>
    <a class="brand" href="/admin/" aria-label="Administration salacv.online"><img class="brand-mark ad-mark" src="/brand.svg" alt="" width="28" height="28">salacv<span class="brand-tld">.online</span></a>
    <label class="ad-search" hidden>
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Rechercher dans cette page" aria-label="Rechercher dans cette page">
      <kbd>Ctrl K</kbd>
    </label>
    <span class="spacer"></span>
    <button id="theme" class="icon-btn" type="button" aria-label="Thème">◐</button>
    <button id="logout" class="ad-avatar" type="button" aria-label="Se déconnecter" title="Se déconnecter" hidden>A</button>
  </header>

  <div class="ad-shell">
    <!-- Barre latérale : groupes de navigation. -->
    <aside id="side" class="ad-side" aria-label="Navigation" hidden>
      <nav class="ad-nav">
        <a href="/dashboard/" class="ad-link"><span class="ad-ico" data-i="explore"></span>Retour à l'app</a>
        <p class="ad-group">Administration</p>
        <a href="#apercu" data-tab="apercu" class="ad-link"><span class="ad-ico" data-i="shield"></span>Aperçu</a>
        <a href="#utilisateurs" data-tab="utilisateurs" class="ad-link"><span class="ad-ico" data-i="users"></span>Utilisateurs<span class="ad-badge" id="badge-blocked" hidden></span></a>
        <a href="#cv" data-tab="cv" class="ad-link"><span class="ad-ico" data-i="file"></span>CV d'essai</a>
        <a href="#boutique" data-tab="boutique" class="ad-link"><span class="ad-ico" data-i="cart"></span>Boutique</a>
        <a href="#ia" data-tab="ia" class="ad-link"><span class="ad-ico" data-i="gauge"></span>IA des comptes</a>
        <a href="#contact" data-tab="contact" class="ad-link"><span class="ad-ico" data-i="mail"></span>Contact</a>
        <p class="ad-group">Agent</p>
        <a href="#ressources" data-tab="ressources" class="ad-link"><span class="ad-ico" data-i="box"></span>Ressources</a>
        <a href="#modeles" data-tab="modeles" class="ad-link"><span class="ad-ico" data-i="file"></span>Modèles</a>
        <a href="#skills" data-tab="skills" class="ad-link"><span class="ad-ico" data-i="spark"></span>Skills</a>
        <a href="#cles" data-tab="cles" class="ad-link"><span class="ad-ico" data-i="key"></span>Clés IA</a>
        <p class="ad-group">Suivi</p>
        <a href="#journal" data-tab="journal" class="ad-link"><span class="ad-ico" data-i="log"></span>Journal</a>
      </nav>
      <div class="ad-side-foot">
        <a href="/" class="ad-link"><span class="ad-ico" data-i="home"></span>Accueil salacv</a>
      </div>
    </aside>
    <div id="scrim" class="ad-scrim" hidden></div>

    <main id="view" class="ad-main" tabindex="-1"></main>
  </div>

  <script type="module" src="../admin.js"></script>
</body>
</html>
