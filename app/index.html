<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>salacv — éditeur de CV</title>
  <script>
    // Thème appliqué avant le premier rendu pour éviter un flash clair.
    try { document.documentElement.dataset.theme = localStorage.getItem('salacv:theme') || 'dark'; } catch {}
  </script>
  <link rel="stylesheet" href="./tokens.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <span class="logo"><span class="logo-mark">S</span>salacv</span>
    <div class="actions">
      <label class="toggle"><input type="checkbox" id="watermark" checked> Filigrane aperçu</label>
      <button id="theme" class="btn-ghost" aria-label="Changer de thème" title="Changer de thème">◐</button>
      <button id="export" class="btn-primary">Exporter PDF <kbd>Ctrl S</kbd></button>
    </div>
  </header>
  <main>
    <section class="panel editor">
      <div class="panel-head">DSL / JSON</div>
      <textarea id="source" spellcheck="false"></textarea>
      <div id="status" class="status">Chargement du moteur…</div>
    </section>
    <section class="panel preview">
      <div class="panel-head">APERÇU / SKIA <span id="pages"></span></div>
      <div id="canvases"><div class="page-skeleton skeleton"></div></div>
    </section>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
