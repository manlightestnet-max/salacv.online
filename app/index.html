<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>salacv — crée ton CV</title>
  <script>
    // Thème appliqué avant le premier rendu pour éviter un flash clair.
    try { document.documentElement.dataset.theme = localStorage.getItem('salacv:theme') || 'dark'; } catch {}
  </script>
  <link rel="stylesheet" href="./tokens.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <span class="logo"><span class="logo-mark">S</span>salacv</span>
    <span id="progress" class="progress"></span>
    <div class="actions">
      <button id="theme" class="btn-ghost icon" aria-label="Changer de thème" title="Changer de thème">◐</button>
      <button id="download" class="btn-primary">Télécharger <kbd>Ctrl S</kbd></button>
    </div>
  </header>
  <main>
    <section class="panel form-panel">
      <nav id="stepper" class="stepper" aria-label="Étapes"></nav>
      <div id="step" class="step-scroll"></div>
      <footer class="step-nav">
        <button id="prev" class="btn-text" type="button">Précédent</button>
        <span class="shortcut-hint">Alt ← / Alt → pour changer d'étape</span>
        <button id="next" class="btn-primary" type="button">Suivant</button>
      </footer>
    </section>
    <section class="panel preview">
      <div class="preview-head">Aperçu <span id="pages"></span></div>
      <div id="canvases"><div class="page-skeleton skeleton"></div></div>
    </section>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
