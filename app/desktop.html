<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>salacv</title>
  <link rel="icon" href="/brand.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <style>html { background: #f8fafc; }</style>
  <script>
    // Entrée de l'app desktop : connecté (session Google / clé en ligne valide, ou clé hors ligne
    // active sur ce PC) → tableau de bord ; sinon → page d'accueil (connexion).
    (function () {
      var go = function (logged) { location.replace(logged ? '/dashboard/' : '/welcome/'); };
      fetch('/api/me', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d && d.loggedIn) return go(true);
          var lic = window.desktop && window.desktop.license;
          if (!lic) return go(false);
          return lic.status().then(function (st) { go(Boolean(st && st.state === 'active')); }, function () { go(false); });
        })
        .catch(function () { go(false); });
    })();
  </script>
</head>
<body></body>
</html>
